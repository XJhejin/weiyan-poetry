name: Linux control gateway and deployment bundle
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r 服务端/requirements-headless.txt -r 服务器控制端/requirements.txt
      - run: python 服务端/tests/test_linux_control.py
      - run: python 服务器控制端/tests/test_control.py
      - run: python 服务器控制端/tests/test_password.py
      - run: python 服务端/tools/build_linux_bundle.py --output build-output
      - uses: actions/upload-artifact@v4
        with:
          name: weiyan-linux
          path: build-output/weiyan-server-*-linux-source.tar.gz*
          retention-days: 7
