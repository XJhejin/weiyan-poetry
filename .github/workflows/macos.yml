name: Apple Silicon server DMG
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64
      - name: Check Apple Silicon architecture
        run: python -c "import platform; assert platform.machine() == 'arm64'"
      - name: Install build dependencies
        run: python -m pip install -r 服务端/requirements.txt -r 客户端/tools/requirements.txt
      - name: Test custom IPv4 and IPv6 listening addresses
        run: python 服务端/tests/test_listening.py
      - name: Test signed GitHub checks and bundled TLS trust
        run: python 服务端/tests/test_github_updates.py
      - name: Build signed ARM64 app and DMG
        run: python 服务端/tools/build_macos.py
      - name: Check signed GitHub updates from the actual bundled Mac app
        run: |
          export SSL_CERT_FILE="$RUNNER_TEMP/missing-system-ca.pem"
          export SSL_CERT_DIR="$RUNNER_TEMP/missing-system-certs"
          build-output/macos/未言诗集服务端.app/Contents/MacOS/未言诗集服务端 --check-github-update "$RUNNER_TEMP/github-update.json"
          cat "$RUNNER_TEMP/github-update.json"
      - name: Test the actual ARM64 server with encrypted clients
        env:
          WEIYAN_TEST_PORTABLE: '1'
        run: |
          export WEIYAN_SERVER_EXECUTABLE="$PWD/build-output/macos/未言诗集服务端.app/Contents/MacOS/未言诗集服务端"
          python 服务端/tests/test_chat.py
      - name: Launch native management window
        run: |
          export WEIYAN_DATA_DIR="$RUNNER_TEMP/weiyan-gui"
          build-output/macos/未言诗集服务端.app/Contents/MacOS/未言诗集服务端 --host 127.0.0.1 --port 23074 > "$RUNNER_TEMP/gui.log" 2>&1 &
          app_pid=$!
          sleep 15
          kill -0 "$app_pid"
          curl --fail http://127.0.0.1:23074/api/health
          screencapture -x build-output/macos-management.png
          kill "$app_pid"
      - uses: actions/upload-artifact@v4
        with:
          name: weiyan-macos-arm64
          path: |
            build-output/*.dmg
            build-output/macos-management.png
          retention-days: 7
