name: Windows tests and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r 客户端/requirements.txt -r 客户端/tools/requirements.txt
      - name: Test chat, encryption and offline history
        run: python 服务端/tests/test_chat.py
      - name: Test large encrypted file bounds and bounded memory reads
        run: python 客户端/tests/test_large_files.py
      - name: Test quotes, mentions, instant local history and connection resilience
        run: |
          python 服务端/tests/test_message_features.py
          python 客户端/tests/test_transport.py
      - name: Test administration, migration and signed updates
        run: python 服务端/tests/test_privacy_tools.py
      - name: Test custom IPv4 and IPv6 listening addresses
        run: python 服务端/tests/test_listening.py
      - name: Test whole-logo tray animation and unread lifecycle
        run: python 客户端/tests/test_tray.py
      - name: Test update startup failures preserve the running application
        run: python 客户端/tests/test_update_runtime.py
      - name: Test default address migration preserves custom servers
        run: python 客户端/tests/test_default_server.py
      - name: Test GitHub update fallback and bundled TLS trust
        run: python 服务端/tests/test_github_updates.py
      - name: Test remote control permissions and Linux update rollback
        run: python 服务端/tests/test_linux_control.py
      - name: Test local control UI authentication and account-bound credentials
        run: python 服务器控制端/tests/test_control.py
      - name: Test self-hosted download integrity gates
        run: python 官网/tools/test_site.py
      - name: Build independent Windows programs
        run: python 客户端/tools/build.py
      - name: Build independent server controller
        run: python 服务器控制端/tools/build.py
      - name: Test actual executables
        env:
          WEIYAN_TEST_BINARIES: '1'
        run: |
          python 服务端/tests/test_chat.py
          python 服务端/tests/test_message_features.py
      - name: Test copied standalone helper from actual frozen applications
        env:
          WEIYAN_TEST_BINARIES: '1'
        run: python 客户端/tests/test_update_runtime.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build Windows client MSI
        run: |
          dotnet tool install --tool-path .build/wix wix --version 5.0.2
          .build/wix/wix.exe extension add -g WixToolset.UI.wixext/5.0.2
          python 客户端/tools/build_msi.py --wix .build/wix/wix.exe
          python 客户端/tools/build_msi.py --kind control --wix .build/wix/wix.exe
      - uses: actions/upload-artifact@v4
        with:
          name: weiyan-windows-unsigned
          path: |
            build-output/未言诗集/
            build-output/未言诗集服务端/
            build-output/未言诗集服务器控制端/
            build-output/*.msi
          retention-days: 7
